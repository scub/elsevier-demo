on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - "main"

permissions:
  contents: read

defaults:
  run:
    shell: bash

name: Pull request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.1

  