on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

name: Release environment

concurrency:
  group: tofu-plan-and-apply
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/dev

    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.2"
      
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      
      - run: tofu init
      - run: tofu plan -no-color -out=tfplan
        env:
          TF_VAR_personal_ip: ${{ vars.PERSONAL_IP }}
          TF_VAR_alerting_email: ${{ vars.ALERTING_EMAIL }}

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ./terraform/dev/tfplan
          retention-days: 1
          if-no-files-found: error
      
      - uses: actions/upload-artifact@v7
        with:
          name: app.zip
          path: ./terraform/dev/app.zip
          retention-days: 1
          if-no-files-found: error

  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: plan
    environment: dev

    defaults:
      run:
        working-directory: ./terraform/dev

    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.2"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: ./terraform/dev/

      - uses: actions/download-artifact@v8
        with:
          name: app.zip
          path: ./terraform/dev/

      - run: tofu init
      - run: tofu apply "./tfplan"

  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: apply

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - run: go mod tidy
      - run: go test -v -count=1 -timeout 10m ./test/...
        env:
          TERRATEST_APPLY: 1