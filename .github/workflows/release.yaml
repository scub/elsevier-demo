on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash
    working-directory: ./terraform/dev

name: Release environment

concurrency:
  group: tofu-plan-and-apply
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"
      
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      
      - run: tofu init
      - run: tofu plan -no-color -out=${{ github.run_id }}.tfplan
        env:
          TF_VAR_personal_ip: ${{ vars.PERSONAL_IP }}
          TF_VAR_alerting_email: ${{ vars.ALERTING_EMAIL }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_id }}.tfplan
          path: ${{ github.run_id }}.tfplan
          retention-days: 1
      
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: plan
    environment: dev

    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.2"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.run_id }}.tfplan

      - run: tofu init
      - run: tofu apply ${{ github.run_id }}.tfplan